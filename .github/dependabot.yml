# Keep dependencies and pinned actions current. Dependabot opens PRs that CI
# gates, so updates are reviewed, not blindly trusted.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
